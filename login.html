<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login 💖</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffe3ef,
                    #e5dcff,
                    #fff0d6
                );

            color: #55334f;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 420px;

            background:
                rgba(255,255,255,0.7);

            backdrop-filter: blur(15px);

            padding: 45px 35px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.15);

            text-align: center;

            animation: appear 0.8s ease;

        }


        .icon {

            font-size: 65px;

            margin-bottom: 10px;

        }


        h1 {

            color: #8c3e70;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #8b6380;

            margin-bottom: 30px;

            line-height: 1.5;

        }


        .input-group {

            text-align: left;

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #e0b8ce;

            border-radius: 12px;

            outline: none;

            font-size: 16px;

            background:
                rgba(255,255,255,0.8);

        }


        input:focus {

            border-color: #d14d8b;

            box-shadow:
                0 0 8px
                rgba(209,77,139,0.2);

        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #d14d8b;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            background: #b93876;

            transform: scale(1.03);

        }


        .register-link {

            margin-top: 22px;

            font-size: 15px;

        }


        .register-link a {

            color: #d14d8b;

            font-weight: bold;

            text-decoration: none;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        .message {

            margin-top: 18px;

            min-height: 20px;

            font-weight: bold;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(30px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @media (max-width: 500px) {

            .container {

                padding:
                    40px 25px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ICON -->

        <div class="icon">
            💖
        </div>


        <!-- TITLE -->

        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">

            Login to enter your
            birthday surprise. 🎂💕

        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit">

                💕 Login

            </button>


        </form>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message">
        </div>


        <!-- REGISTER -->

        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>


    </div>



    <script>


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    /* GET INPUT VALUES */

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim()
                            .toLowerCase();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    /* GET REGISTERED USER */

                    const storedUser =
                        JSON.parse(
                            localStorage.getItem(
                                "birthdayUser"
                            )
                        );


                    /* CHECK ACCOUNT */

                    if (!storedUser) {

                        message.textContent =
                            "❌ No account found. Please register first.";

                        message.style.color =
                            "#c0395f";

                        return;

                    }


                    /* CHECK LOGIN DETAILS */

                    if (
                        email === storedUser.email &&
                        password === storedUser.password
                    ) {


                        /* LOGIN SUCCESS */

                        localStorage.setItem(
                            "isLoggedIn",
                            "true"
                        );


                        localStorage.setItem(
                            "loggedInName",
                            storedUser.name
                        );


                        message.textContent =
                            "💕 Login successful!";

                        message.style.color =
                            "#8c3e70";


                        /* GO TO HOME */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "home.html";

                            },
                            1000
                        );


                    }

                    else {

                        message.textContent =
                            "❌ Incorrect email or password.";

                        message.style.color =
                            "#c0395f";

                    }

                }
            );

    </script>


</body>

</html>
