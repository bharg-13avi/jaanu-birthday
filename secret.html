```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Secret For You 💌</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;

            background:
                linear-gradient(135deg, #ffe5ef, #eadcff);

            color: #5a3152;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(15px);

            padding: 40px 30px;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15);

            text-align: center;

            animation: appear 1s ease;
        }

        .heart {
            font-size: 65px;
            margin-bottom: 15px;

            animation: heartbeat 1.5s infinite;
        }

        h1 {
            color: #8c3e70;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .message {
            font-size: 18px;
            line-height: 1.8;
            color: #704a67;
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-height: 500px;

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.18);

            background: #000;
        }

        .small-message {
            margin-top: 25px;

            font-size: 18px;
            line-height: 1.7;

            color: #8c3e70;
        }

        .hearts {
            margin-top: 20px;
            font-size: 28px;
            letter-spacing: 8px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .heart {
                font-size: 50px;
            }

            .message,
            .small-message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">
            💌
        </div>

        <h1>
            You Found My Little Secret 💕
        </h1>

        <p class="message">
            Jaanu... 🥹❤️
            <br><br>
            This is something I wanted to say
            to you personally.
            <br><br>
            So here is one last little surprise
            just for you. 🎂✨
        </p>

        <video controls playsinline>
            <source src="video/jaanu-wishes.mp4" type="video/mp4">
            Your browser does not support the video.
        </video>

        <p class="small-message">
            I hope you smile while watching this. 🥹💕
            <br><br>
            Happy Birthday, Jaanu! 🎂❤️
        </p>

        <div class="hearts">
            💕 💗 💕
        </div>

    </div>

</body>

</html>
```
