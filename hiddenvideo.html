```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Video For You 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffe5ef, #eadcff);
            color: #5a3152;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);

            padding: 35px;
            border-radius: 25px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .heart {
            font-size: 60px;
            margin-bottom: 15px;

            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        h1 {
            color: #8c3e70;
            margin-bottom: 12px;
            font-size: 38px;
        }

        .subtitle {
            color: #704a67;
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        /* VIDEO AREA */

        .video-container {
            position: relative;
            width: 100%;

            background: #000;

            border-radius: 18px;
            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            margin-top: 20px;
        }

        .video-container iframe {
            display: block;

            width: 100%;
            height: 500px;

            border: none;
            border-radius: 18px;

            background: #000;
        }

        .message {
            margin-top: 25px;

            color: #8c3e70;
            font-size: 20px;

            line-height: 1.7;
            font-weight: bold;
        }

        .small-note {
            margin-top: 15px;

            font-size: 14px;
            color: #8a7183;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 25px 15px;
                border-radius: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 16px;
            }

            .heart {
                font-size: 50px;
            }

            .video-container iframe {
                height: 300px;
            }

            .message {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">
            💖
        </div>

        <h1>
            A Special Message For You, Jaanu 💕

        </p>

        <div class="video-container">

        </div>

        <div class="small-note">
            Take your time... this message was made especially for you. 💕
        </div>

    </div>

</body>
</html>
